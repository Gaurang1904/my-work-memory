<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/public.css?v=3" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Work Chat</p>
        <h1>Ask about my internship work.</h1>
      </div>
      <div class="topbar-actions">
        <button id="toggle-report" class="ghost" type="button">Report Tool</button>
        <a href="/admin" class="ghost link-button">Admin</a>
      </div>
    </header>

    <section id="report-panel" class="report-panel hidden">
      <form id="public-report-form" class="report-form">
        <input type="text" id="public-report-type" value="final_internship_report" required />
        <textarea id="public-report-topic" rows="3" placeholder="Backend internship work summary" required></textarea>
        <button type="submit">Generate Report</button>
      </form>
    </section>

    <section class="chat-panel">
      <div id="chat-thread" class="chat-thread"></div>

      <div class="composer-shell">
        <form id="public-ask-form" class="composer">
          <textarea id="public-question" rows="2" placeholder="Ask about projects, backend work, AI work, timelines..." required></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/static/public.js?v=3"></script>
</body>
</html>
