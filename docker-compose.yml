services:
  db:
    image: pgvector/pgvector:pg17
    container_name: personal-doc-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_doc_agent
    ports:
      # 5433 is taken by the ai-gateway (FluxLLM) Postgres; both run side by side.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
