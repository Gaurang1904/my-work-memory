databases:
  - name: aura-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: aura-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # paste in Render dashboard, never committed
      - key: CORS_ALLOW_ORIGINS
        value: https://gauranggupta.netlify.app,http://localhost:5173,http://127.0.0.1:5173
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
